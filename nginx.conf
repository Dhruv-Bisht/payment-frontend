server {
  listen 80;
  root /usr/share/nginx/html;

  # Same-origin API: the browser talks only to this server, so no CORS is involved.
  location /api/ {
    proxy_pass http://app:3345;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  location /actuator/ {
    proxy_pass http://app:3345;
    proxy_set_header Host $host;
  }

  location / {
    try_files $uri /index.html;
  }
}
